name: Aktualizace rozpisu akcí

on:
  schedule:
    # Spouští se každých 6 hodin (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'scraper/package.json'

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm install

      - name: Run event scraper
        working-directory: scraper
        run: npm run scrape

      - name: Commit and push updated events.json
        run: |
          if git diff --quiet data/events.json; then
            echo "Žádná změna v data/events.json, commit přeskočen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "chore(data): automatická aktualizace rozpisu akcí"
          git push
